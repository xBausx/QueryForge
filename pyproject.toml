[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "queryforge"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6,<3",
    "sqlglot>=25,<27",
    "PyYAML>=6,<7",
    "tzdata>=2024.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
queryforge = "orchestrator.cli:main"
