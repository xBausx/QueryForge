[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "queryforge-orchestrator"
version = "0.1.0"
description = "AST-Centric Orchestrator for QueryForge (Phase 1)"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2",
  "sqlglot>=26,<27",
  "PyYAML>=6"
]

[tool.setuptools.packages.find]
where = ["src"]
